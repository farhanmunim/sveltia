<svg xmlns="http://www.w3.org/2000/svg" aria-label="Layer diagram: each virtual machine carries its own guest operating system on top of a hypervisor, while containers share the host operating system's kernel through a container runtime" role="img" style="display:block;width:100%;max-width:560px;height:auto;margin:0 auto" viewbox="0 0 560 250">
<text class="t-head" fill="currentColor" font-size="12" font-weight="600" text-anchor="middle" x="145" y="20">Virtual machines</text>
<text class="t-head" fill="currentColor" font-size="12" font-weight="600" text-anchor="middle" x="415" y="20">Containers</text>
<rect class="box" fill="currentColor" fill-opacity=".05" height="120" rx="6" stroke="currentColor" stroke-opacity=".28" width="120" x="20" y="32"></rect>
<text fill="currentColor" font-size="12" text-anchor="middle" x="80" y="80">App</text>
<text class="t-muted" fill="currentColor" fill-opacity=".65" font-size="11" text-anchor="middle" x="80" y="134">Guest OS (its own)</text>
<rect class="box" fill="currentColor" fill-opacity=".05" height="120" rx="6" stroke="currentColor" stroke-opacity=".28" width="120" x="150" y="32"></rect>
<text fill="currentColor" font-size="12" text-anchor="middle" x="210" y="80">App</text>
<text class="t-muted" fill="currentColor" fill-opacity=".65" font-size="11" text-anchor="middle" x="210" y="134">Guest OS (its own)</text>
<rect class="box" fill="currentColor" fill-opacity=".05" height="34" rx="6" stroke="currentColor" stroke-opacity=".28" width="250" x="20" y="160"></rect>
<text fill="currentColor" font-size="12" text-anchor="middle" x="145" y="181">Hypervisor</text>
<rect class="box" fill="currentColor" fill-opacity=".05" height="34" rx="6" stroke="currentColor" stroke-opacity=".28" width="250" x="20" y="202"></rect>
<text class="t-muted" fill="currentColor" fill-opacity=".65" font-size="11" text-anchor="middle" x="145" y="223">Physical hardware</text>
<rect class="box-accent" fill="#2563eb" fill-opacity=".1" height="60" rx="6" stroke="#2563eb" width="120" x="290" y="92"></rect>
<text fill="currentColor" font-size="12" text-anchor="middle" x="350" y="127">App</text>
<rect class="box-accent" fill="#2563eb" fill-opacity=".1" height="60" rx="6" stroke="#2563eb" width="120" x="420" y="92"></rect>
<text fill="currentColor" font-size="12" text-anchor="middle" x="480" y="127">App</text>
<rect class="box" fill="currentColor" fill-opacity=".05" height="34" rx="6" stroke="currentColor" stroke-opacity=".28" width="250" x="290" y="160"></rect>
<text fill="currentColor" font-size="12" text-anchor="middle" x="415" y="181">Container runtime (Docker)</text>
<rect class="box" fill="currentColor" fill-opacity=".05" height="34" rx="6" stroke="currentColor" stroke-opacity=".28" width="250" x="290" y="202"></rect>
<text class="t-muted" fill="currentColor" fill-opacity=".65" font-size="11" text-anchor="middle" x="415" y="223">Host OS on the hardware — one shared kernel</text>
</svg>